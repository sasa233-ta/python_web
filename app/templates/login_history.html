<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン履歴</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  {% include "header.html" %}
  <div class="container mt-4">
    <h2>ログイン履歴</h2>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>日時</th>
          <th>ユーザー名</th>
        </tr>
      </thead>
      <tbody>
        {% for h in histories %}
        <tr>
          <td>{{ h.login_at.strftime('%Y-%m-%d %H:%M:%S') }}</td>
          <td>{{ h.username }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
